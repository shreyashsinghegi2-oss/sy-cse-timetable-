<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - StudentLancing</title>
  <meta name="description" content="Your StudentLancing dashboard - manage projects, applications, and messages.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/student-lancing/css/style.css">
  
  <style>
    .dashboard-grid {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 32px;
    }
    .sidebar-card {
      position: sticky;
      top: 100px;
    }
    .user-avatar-large {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: var(--gradient-primary);
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: 700;
      box-shadow: var(--shadow-neon-blue);
    }
    .user-avatar-large img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }
    .quick-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 24px;
    }
    .quick-action {
      padding: 16px;
      border-radius: var(--border-radius-sm);
      background: var(--bg-glass);
      border: 1px solid var(--glass-border);
      text-align: center;
      cursor: pointer;
      transition: var(--transition-fast);
      text-decoration: none;
      color: var(--text-primary);
    }
    .quick-action:hover {
      border-color: var(--neon-blue);
      box-shadow: var(--shadow-neon-blue);
    }
    .quick-action-icon {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }
    .quick-action-text {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .section-title {
      font-size: 1.25rem;
      font-weight: 600;
    }
    @media (max-width: 1024px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
      .sidebar-card {
        position: static;
      }
    }
  </style>
</head>
<body>
  <div class="bg-animated"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  
  <nav class="navbar">
    <div class="container navbar-content">
      <a href="/student-lancing/dashboard.html" class="logo">
        <div class="logo-icon">⚡</div>
        StudentLancing
      </a>
      <div class="nav-links">
        <a href="/student-lancing/dashboard.html" class="nav-link active">Dashboard</a>
        <a href="/student-lancing/projects.html" class="nav-link">Projects</a>
        <a href="/student-lancing/messages.html" class="nav-link">Messages</a>
        <a href="/student-lancing/profile.html" class="nav-link">Profile</a>
      </div>
      <div class="nav-user">
        <div class="user-avatar" onclick="window.location.href='/student-lancing/profile.html'" data-testid="nav-avatar">U</div>
        <button class="btn btn-secondary btn-sm" onclick="window.Auth.signOut()" data-testid="btn-logout">Sign Out</button>
      </div>
    </div>
  </nav>
  
  <main class="main-content">
    <div class="container">
      <div class="page-header">
        <h1 class="page-title">Dashboard</h1>
        <p class="page-subtitle">Welcome back! Here's your freelancing overview.</p>
      </div>
      
      <div id="stats-grid" class="stats-grid"></div>
      
      <div class="dashboard-grid">
        <aside>
          <div class="glass-card glass-card-strong sidebar-card" style="text-align: center;">
            <div id="profile-section">
              <div class="user-avatar-large">U</div>
              <h2 class="user-name">Loading...</h2>
            </div>
            
            <div class="quick-actions">
              <a href="/student-lancing/projects.html" class="quick-action">
                <div class="quick-action-icon">🔍</div>
                <div class="quick-action-text">Find Work</div>
              </a>
              <button class="quick-action" onclick="showCreateProjectModal()">
                <div class="quick-action-icon">➕</div>
                <div class="quick-action-text">Post Gig</div>
              </button>
              <a href="/student-lancing/messages.html" class="quick-action">
                <div class="quick-action-icon">💬</div>
                <div class="quick-action-text">Messages</div>
              </a>
              <a href="/student-lancing/profile.html" class="quick-action">
                <div class="quick-action-icon">⚙️</div>
                <div class="quick-action-text">Settings</div>
              </a>
            </div>
          </div>
        </aside>
        
        <div class="main-column">
          <section class="mb-4">
            <div class="section-header">
              <h2 class="section-title">Your Applications</h2>
              <a href="/student-lancing/projects.html" class="btn btn-outline btn-sm">View All</a>
            </div>
            <div id="recent-applications"></div>
          </section>
          
          <section>
            <div class="section-header">
              <h2 class="section-title">Your Projects</h2>
              <button class="btn btn-success btn-sm" onclick="showCreateProjectModal()">+ New Project</button>
            </div>
            <div id="recent-projects" class="projects-grid"></div>
          </section>
        </div>
      </div>
    </div>
  </main>
  
  <div id="create-project-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Post a New Project</h3>
        <button class="modal-close" onclick="Utils.hideModal('create-project-modal')">&times;</button>
      </div>
      <form id="create-project-form" onsubmit="Dashboard.handleCreateProject(event)">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">Project Title *</label>
            <input type="text" name="title" class="form-input" placeholder="e.g., Design a Logo for My Startup" required>
          </div>
          <div class="form-group">
            <label class="form-label">Description *</label>
            <textarea name="description" class="form-input" placeholder="Describe your project requirements..." required></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">Category</label>
            <select name="category" class="form-input form-select">
              <option value="Design">Design</option>
              <option value="Development">Development</option>
              <option value="Writing">Writing</option>
              <option value="Marketing">Marketing</option>
              <option value="Video">Video</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Budget (₹)</label>
            <input type="number" name="budget" class="form-input" placeholder="e.g., 5000" min="100">
          </div>
          <div class="form-group">
            <label class="form-label">Duration</label>
            <select name="duration" class="form-input form-select">
              <option value="Less than 1 week">Less than 1 week</option>
              <option value="1-2 weeks">1-2 weeks</option>
              <option value="2-4 weeks">2-4 weeks</option>
              <option value="1-3 months">1-3 months</option>
              <option value="3+ months">3+ months</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Required Skills (comma separated)</label>
            <input type="text" name="skills" class="form-input" placeholder="e.g., Photoshop, Illustrator, Figma">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="Utils.hideModal('create-project-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Post Project</button>
        </div>
      </form>
    </div>
  </div>
  
  <div id="toast-container" class="toast-container"></div>
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
  
  <script src="/student-lancing/js/firebase-config.js"></script>
  <script src="/student-lancing/js/utils.js"></script>
  <script src="/student-lancing/js/auth.js"></script>
  <script src="/student-lancing/js/projects.js"></script>
  <script src="/student-lancing/js/messages.js"></script>
  <script src="/student-lancing/js/dashboard.js"></script>
  
  <script>
    async function initApp() {
      try {
        const response = await fetch('/api/student-lancing/config');
        window.FIREBASE_CONFIG = await response.json();
        window.Auth.init();
        
        firebase.auth().onAuthStateChanged((user) => {
          if (user) {
            window.Dashboard.init();
          }
        });
      } catch (error) {
        console.error('Failed to load Firebase config:', error);
        showToast('Failed to initialize app', 'error');
      }
    }
    
    document.addEventListener('DOMContentLoaded', initApp);
    
    function showCreateProjectModal() {
      window.Utils.showModal('create-project-modal');
    }
  </script>
</body>
</html>
