  <body>
    <div id="loading-indicator">
      <div class="ld-spin"></div>
      <div style="font-family:'Inter',system-ui,sans-serif;font-size:18px;font-weight:500;color:#2563eb;">StudentXchange</div>
      <div id="ld-slow-msg" style="display:none;font-family:'Inter',system-ui,sans-serif;font-size:13px;color:#6b7280;margin-top:8px;text-align:center;max-width:260px;">Loading resources, please wait…</div>
      <button id="ld-reload-btn" type="button" style="display:none;margin-top:14px;background:#2563eb;color:#fff;border:none;padding:9px 20px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;">Reload Page</button>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <script>
      (function(){
        var li=document.getElementById('loading-indicator');
        if(!li)return;
        var reloadButton=document.getElementById('ld-reload-btn');
        if(reloadButton)reloadButton.addEventListener('click',function(){window.location.reload();});

        // Hide as soon as React renders any content into #root
        var mo=new MutationObserver(function(){
          var r=document.getElementById('root');
          if(r&&r.children.length>0){
            mo.disconnect();
            clearTimeout(slowTimer);
            clearTimeout(reloadTimer);
            clearTimeout(safetyTimer);
            li.style.display='none';
          }
        });
        mo.observe(document.getElementById('root')||document.body,{childList:true,subtree:true});

        // After 6 s — show "loading resources" hint (cold Vite startup)
        var slowTimer=setTimeout(function(){
          var m=document.getElementById('ld-slow-msg');
          if(m)m.style.display='block';
        },6000);

        // After 14 s — show Reload button (something stalled)
        var reloadTimer=setTimeout(function(){
          var b=document.getElementById('ld-reload-btn');
          if(b)b.style.display='block';
          var m=document.getElementById('ld-slow-msg');
          if(m)m.textContent='This is taking longer than expected.';
        },14000);

        // Hard safety cap: 30 s — hide and let whatever rendered show through
        var safetyTimer=setTimeout(function(){
          mo.disconnect();
          li.style.display='none';
        },30000);
      })();
    </script>
  </body>
